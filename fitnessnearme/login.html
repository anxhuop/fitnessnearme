<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — FitnessNearMe</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans&display=swap" rel="stylesheet"/>

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-card">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Login to continue your fitness journey 💪</p>

    <input type="email" id="email" placeholder="Email"/>
    <input type="password" id="password" placeholder="Password"/>

    <button class="btn-primary" onclick="login()">Login</button>

    <p class="auth-link">
      New here? <span onclick="signup()">Create account</span>
    </p>
  </div>

</div>

<script src="auth.js"></script>
</body>
</html>
